<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Hikmah Journal | Wisdom & Heritage Application</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts for Classical Arabic and Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Inter:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body id="appBody" class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between theme-transition antialiased">

    <!-- TOP HEADER / APP BAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <!-- LOGO & BRANDING -->
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-emerald-700 text-white flex items-center justify-center shadow-md shadow-emerald-700/20">
                    <i class="fa-solid fa-book-open text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 data-i18n="headerTitle" class="font-bold text-slate-900 text-lg leading-none tracking-tight">Al-Hikmah Journal</h1>
                        <span data-i18n="headerBadge" class="bg-emerald-100 text-emerald-800 text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase tracking-wider">Wisdom & Heritage</span>
                    </div>
                    <p data-i18n="headerSub" class="text-xs text-slate-500 hidden sm:block mt-0.5">Islamic Inscriptions, Prophetic Traditions & Golden Age Discoveries</p>
                </div>
            </div>

            <!-- HEADER ACTIONS & METRICS -->
            <div class="flex items-center space-x-2 sm:space-x-3 rtl:space-x-reverse">
                
                <!-- STREAK COUNTER -->
                <div class="hidden md:flex items-center space-x-1.5 rtl:space-x-reverse bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-lg text-amber-800 text-xs font-semibold">
                    <i class="fa-solid fa-fire text-amber-500"></i>
                    <span id="streakCountText">3</span>
                    <span data-i18n="streakDays" class="text-[11px] font-normal text-amber-700">Day Streak</span>
                </div>

                <!-- ARCHITECTURE INSPECTOR -->
                <button onclick="openArchModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 border border-slate-200 transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group text-emerald-600"></i>
                    <span data-i18n="btnArch3Layer" class="hidden sm:inline">3-Layer Arch</span>
                </button>

                <!-- SAVED MANUSCRIPTS -->
                <button id="openFavoritesBtn" onclick="openFavoritesModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 border border-slate-200 transition-colors flex items-center gap-2 relative">
                    <i class="fa-regular fa-bookmark text-emerald-600"></i>
                    <span data-i18n="btnSavedMs" class="hidden sm:inline">Saved</span>
                    <span id="favCountBadge" class="bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
                </button>

                <!-- SESSION LEDGER AUDIT -->
                <button id="openHistoryBtn" onclick="openHistoryModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 border border-slate-200 transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-amber-600"></i>
                    <span data-i18n="btnSessionLedger" class="hidden sm:inline">Ledger</span>
                </button>

                <!-- LANGUAGE SELECTOR -->
                <div class="relative">
                    <select id="langSelect" class="bg-slate-100 border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium cursor-pointer">
                        <option value="en">English (EN)</option>
                        <option value="ar">العربية (AR)</option>
                        <option value="es">Español (ES)</option>
                        <option value="fr">Français (FR)</option>
                        <option value="de">Deutsch (DE)</option>
                        <option value="tr">Türkçe (TR)</option>
                        <option value="ur">اردو (UR)</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

        <!-- CONTROL BAR: DOMAIN, ERA & THEMES -->
        <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5 space-y-4">
            
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                
                <!-- DOMAIN SELECTOR -->
                <div class="flex flex-col space-y-1.5 flex-1">
                    <label for="domainSelect" data-i18n="lblDomainFocus" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Knowledge Domain Focus:</label>
                    <select id="domainSelect" onchange="retrieveKnowledgePair()" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3.5 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium cursor-pointer">
                        <option value="all" data-i18n="optAll">📖 All Knowledge Traditions</option>
                        <option value="quran" data-i18n="optQuran">📖 Noble Quran (Revelation)</option>
                        <option value="hadith" data-i18n="optHadith">📜 Prophetic Sunnah (Hadith)</option
